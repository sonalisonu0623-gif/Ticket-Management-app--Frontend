<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>TicketOps Secure Login</h2>
      <p class="text-muted">Enter credentials to manage your system tracking parameters</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="usernameOrEmail">Username or Email</label>
        <input
          id="usernameOrEmail"
          type="text"
          formControlName="usernameOrEmail"
          class="form-control"
          placeholder="Enter username or account email"
          [class.is-invalid]="hasError('usernameOrEmail')"
        />
        <div class="error-msg" *ngIf="hasError('usernameOrEmail')">
          Identification entry is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">System Verification Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
          [class.is-invalid]="hasError('password')"
        />
        <div class="error-msg" *ngIf="hasError('password')">
          Valid access password is required (minimum 4 digits)
        </div>
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary btn-block">
        <span *ngIf="!loading">Authenticate Entry</span>
        <span *ngIf="loading">Validating Secure Handshake...</span>
      </button>
    </form>
  </div>
</div>
