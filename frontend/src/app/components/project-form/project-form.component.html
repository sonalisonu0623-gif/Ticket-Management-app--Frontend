<div class="form-page">

  <!-- Page Header -->
  <div class="page-header">
    <a routerLink="/configuration" [queryParams]="{tab: 'projects'}" class="back-link">‹ Back to Configuration</a>
    <div class="page-title">
      <span class="title-mark">{{ isEditMode ? '✎' : '＋' }}</span>
      {{ isEditMode ? 'UPDATE PROJECT' : 'CREATE PROJECT' }}
      <span class="ticket-ref" *ngIf="isEditMode && projectCode">· {{ projectCode }}</span>
    </div>
  </div>

  <!-- Alerts -->
  <div class="alert alert-success" *ngIf="successMessage">
    <span>✓</span> {{ successMessage }}
  </div>
  <div class="alert alert-error" *ngIf="error">
    <span>✕</span> {{ error }}
  </div>

  <!-- Loading -->
  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <span>Loading project data...</span>
  </div>

  <!-- Form Card -->
  <div class="form-card" *ngIf="!loading" [formGroup]="projectForm">

    <!-- Row 1: Code + Name -->
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label required">
          <span class="label-prefix">01</span> PROJECT CODE
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="projectCode"
          placeholder="e.g. HR-PORTAL"
          [class.invalid]="isFieldInvalid('projectCode')"
        />
        <div class="field-error" *ngIf="isFieldInvalid('projectCode')">{{ getFieldError('projectCode') }}</div>
      </div>
      <div class="form-group">
        <label class="form-label required">
          <span class="label-prefix">02</span> PROJECT NAME
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="projectName"
          placeholder="e.g. HR Management Portal"
          [class.invalid]="isFieldInvalid('projectName')"
        />
        <div class="field-error" *ngIf="isFieldInvalid('projectName')">{{ getFieldError('projectName') }}</div>
      </div>
    </div>

    <!-- Row 2: Description -->
    <div class="form-grid form-grid-1">
      <div class="form-group">
        <label class="form-label">
          <span class="label-prefix">03</span> DESCRIPTION
        </label>
        <textarea
          class="form-control textarea"
          formControlName="description"
          rows="3"
          placeholder="Brief description of the project..."
        ></textarea>
      </div>
    </div>

    <!-- Row 3: Status + Dates -->
    <div class="form-grid form-grid-3">
      <div class="form-group">
        <label class="form-label required">
          <span class="label-prefix">04</span> STATUS
        </label>
        <select class="form-control" formControlName="status" [class.invalid]="isFieldInvalid('status')">
          <option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</option>
        </select>
        <div class="field-error" *ngIf="isFieldInvalid('status')">{{ getFieldError('status') }}</div>
      </div>
      <div class="form-group">
        <label class="form-label">
          <span class="label-prefix">05</span> START DATE
        </label>
        <input
          type="date"
          class="form-control"
          formControlName="startDate"
        />
      </div>
      <div class="form-group">
        <label class="form-label">
          <span class="label-prefix">06</span> END DATE
        </label>
        <input
          type="date"
          class="form-control"
          formControlName="endDate"
        />
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="button"
        class="btn-submit"
        (click)="onSubmit()"
        [disabled]="submitting"
      >
        <span *ngIf="!submitting">{{ isEditMode ? '↑ UPDATE RECORD' : '✓ ADD RECORD' }}</span>
        <span *ngIf="submitting" class="submitting-text">
          <span class="mini-spinner"></span>
          {{ isEditMode ? 'UPDATING...' : 'CREATING...' }}
        </span>
      </button>
      <button type="button" class="btn-reset" (click)="onReset()" [disabled]="submitting">
        ↺ RESET FORM
      </button>
      <a routerLink="/configuration" [queryParams]="{tab: 'projects'}" class="btn-cancel">✕ CANCEL</a>
    </div>

  </div>
</div>
