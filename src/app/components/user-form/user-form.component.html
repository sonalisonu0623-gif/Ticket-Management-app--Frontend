<div class="form-page">

  <div class="page-header">
    <a routerLink="/users" class="back-link">‹ Back to Users</a>
    <div class="page-title">
      <span class="title-mark">{{ isEditMode ? '✎' : '＋' }}</span>
      {{ isEditMode ? 'EDIT USER' : 'CREATE USER' }}
      <span class="ticket-ref" *ngIf="isEditMode && editUsername">· {{ editUsername }}</span>
    </div>
  </div>

  <div class="alert alert-success" *ngIf="successMessage"><span>✓</span> {{ successMessage }}</div>
  <div class="alert alert-error"   *ngIf="error"><span>✕</span> {{ error }}</div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div><span>Loading...</span>
  </div>

  <div class="form-card" *ngIf="!loading" [formGroup]="userForm">

    <!-- Row 1: Username + Email -->
    <div class="form-grid form-grid-2">
      <div class="form-group">
        <label class="form-label required"><span class="label-prefix">01</span> USERNAME</label>
        <input type="text" class="form-control" formControlName="username"
               placeholder="e.g. john.smith" [class.invalid]="isInvalid('username')" />
        <div class="field-error" *ngIf="isInvalid('username')">{{ getError('username') }}</div>
      </div>
      <div class="form-group">
        <label class="form-label required"><span class="label-prefix">02</span> EMAIL</label>
        <input type="email" class="form-control" formControlName="email"
               placeholder="e.g. john@company.com" [class.invalid]="isInvalid('email')" />
        <div class="field-error" *ngIf="isInvalid('email')">{{ getError('email') }}</div>
      </div>
    </div>

    <!-- Row 2: Password (create only) + Role -->
    <div class="form-grid form-grid-2">
      <div class="form-group" *ngIf="!isEditMode">
        <label class="form-label required"><span class="label-prefix">03</span> PASSWORD</label>
        <input type="password" class="form-control" formControlName="password"
               placeholder="Min 6 characters" [class.invalid]="isInvalid('password')" />
        <div class="field-error" *ngIf="isInvalid('password')">{{ getError('password') }}</div>
      </div>
      <div class="form-group">
        <label class="form-label required">
          <span class="label-prefix">{{ isEditMode ? '03' : '04' }}</span> ROLE
        </label>
        <select class="form-control" formControlName="role" [class.invalid]="isInvalid('role')">
          <option *ngFor="let r of roleOptions" [value]="r.value">{{ r.label }}</option>
        </select>
        <div class="field-error" *ngIf="isInvalid('role')">{{ getError('role') }}</div>
      </div>
    </div>

    <!-- Row 3: Employee mapping + Status (edit only) -->
    <div class="form-grid" [ngClass]="isEditMode ? 'form-grid-2' : 'form-grid-1'">
      <div class="form-group">
        <label class="form-label">
          <span class="label-prefix">{{ isEditMode ? '04' : '05' }}</span> LINKED EMPLOYEE
        </label>
        <select class="form-control" formControlName="employeeId">
          <option [ngValue]="null">— No Employee Mapping —</option>
          <option *ngFor="let emp of employees" [ngValue]="emp.id"
                  [disabled]="emp.userId && emp.userId !== currentUserId">
            {{ emp.employeeName }} ({{ emp.department || emp.designation || 'No Dept' }})
            {{ emp.userId && emp.userId !== currentUserId ? '— Mapped' : '' }}
          </option>
        </select>
      </div>
      <div class="form-group" *ngIf="isEditMode">
        <label class="form-label"><span class="label-prefix">05</span> ACCOUNT STATUS</label>
        <select class="form-control" formControlName="isActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-submit" (click)="onSubmit()" [disabled]="submitting">
        <span *ngIf="!submitting">{{ isEditMode ? '↑ UPDATE USER' : '✓ CREATE USER' }}</span>
        <span *ngIf="submitting" class="submitting-text">
          <span class="mini-spinner"></span>{{ isEditMode ? 'UPDATING...' : 'CREATING...' }}
        </span>
      </button>
      <button type="button" class="btn-reset" (click)="onReset()" [disabled]="submitting">↺ RESET</button>
      <a routerLink="/users" class="btn-cancel">✕ CANCEL</a>
    </div>

  </div>
</div>
